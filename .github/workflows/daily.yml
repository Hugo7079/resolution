name: Daily Resolution

on:
  schedule:
    # 20:00 UTC = 台灣 04:00。刻意排在「晨誌」（20:40 UTC）之前 ——
    # 兩個專案共用同一個 Cloudflare 帳號的每日 neuron 額度，
    # 本專案用量小（一天約 170），先跑就不會被晨誌的封面圖排擠掉。
    # Actions 的 cron 只是排進佇列不保證準時，所以提早排，目標 08:30 前一定看得到。
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD（留空=今天）"
        required: false
      days:
        description: "回溯天數"
        required: false
        default: "2"

# 最後一步要把當日檔 commit 回 repo，預設的唯讀 token 推不上去
permissions:
  contents: write

concurrency:
  group: resolution-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          # 文字：Mistral 的開源小模型。base_url／model／rpm 由
          # src/config.py 的 LLM_PROVIDERS 決定，這裡只給 provider 和金鑰 ——
          # 在這邊硬寫 BASE_URL/MODEL 會蓋掉那組設定，換 provider 就換不動了。
          RES_LLM_PROVIDER:   "mistral"
          RES_LLM_API_KEY:    ${{ secrets.RES_LLM_API_KEY }}
          # 讀圖：Cloudflare Workers AI（不生圖，只描述看到什麼）
          RES_CF_ACCOUNT_ID:  ${{ secrets.RES_CF_ACCOUNT_ID }}
          RES_CF_API_TOKEN:   ${{ secrets.RES_CF_API_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ -n "${{ github.event.inputs.days }}" ] && ARGS="$ARGS --days ${{ github.event.inputs.days }}"
          set +e
          python3 src/pipeline.py $ARGS
          CODE=$?
          set -e
          echo "pipeline_exit=$CODE" >> "$GITHUB_OUTPUT"
          # 2 = 當日檔有產出但缺拆解：照樣部署（作品流與產業動態仍然有價值），
          #     等部署完再把整個 job 標成失敗。其他非零一律當場中止、不部署。
          if [ "$CODE" != "0" ] && [ "$CODE" != "2" ]; then exit "$CODE"; fi

      # pipeline 失敗就不部署 —— 寧可停在昨天的內容，也不要把空白推上線
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESOLUTION }}
          projectId: resolution-0000
          channelId: live

      # 當日檔存回 repo，這樣有歷史、也能回看前幾天
      - name: Commit day file
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 作品池一起 commit —— Actions 每次都是乾淨的機器，
          # 池子不存回來的話，明天的選題又只剩明天抓到的那些。
          git add web/data/ output/pool.json
          git diff --staged --quiet || git commit -m "資料：$(date -u +%Y-%m-%d) 當日檔與作品池"
          git push

      # 部署完才報失敗：內容已經上線，但缺拆解這件事必須看得見
      - name: Fail if feature missing
        if: steps.pipeline.outputs.pipeline_exit == '2'
        run: |
          REASON="$(cat output/last_failure.txt 2>/dev/null || echo '原因未記錄')"
          echo "::error::當日檔已發布，但今天沒有這一件 —— $REASON"
          {
            echo "### 今天沒有「今日一件」"
            echo ""
            echo "當日檔與作品流已上線，缺的是主菜。"
            echo ""
            echo "原因：\`$REASON\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
