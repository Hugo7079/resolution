name: Daily Resolution

on:
  schedule:
    # 台灣 04:10 起每小時一個時段（20:10 / 21:10 / 22:10 / 23:10 UTC）。
    # 每個時段都刻意排在「晨誌」（20:40 UTC 起）對應時段之前 ——
    # 兩個專案共用同一個 Cloudflare 帳號的每日 neuron 額度，
    # 本專案用量小（一天約 170），先跑就不會被晨誌的封面圖排擠掉。
    #
    # GitHub Actions 的 cron 只是「排進佇列」，不保證準時：
    #   - 10 月中通常延遲 2–3 小時，11 月開始拉長
    #   - 2026-11-02 那次延遲 6 小時（台灣 11-03 10:07 才跑，人已經先手動跑了）
    #   - 2026-11-03 那次延遲 4.5 小時（台灣 08:31，剛好錯過 08:30 目標）
    #   - 晨誌 2026-11-03 20:40 UTC 那次則是整個沒觸發
    # 只排一個時段的話，一延遲／被丟掉當天就趕不上。所以排四個當備援，
    # 由下面的 check job 確保「台灣當天已經成功過就不再跑」；
    # 前一個失敗的話，後面的時段等於自動重試。分鐘用 10 避開 HH:00 尖峰。
    #
    # 真正要準時，靠 AI_news repo 的 cron-trigger/ Cloudflare Worker
    # 在固定時間打 workflow_dispatch（見 README「排程可靠性」）。
    - cron: "10 20 * * *"
    - cron: "10 21 * * *"
    - cron: "10 22 * * *"
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD（留空=今天）"
        required: false
      days:
        description: "回溯天數"
        required: false
        default: "2"
      skip_if_done:
        description: "台灣當天已有成功的一次就跳過（外部排程用；手動跑不用勾）"
        type: boolean
        required: false
        default: false

# 最後一步要把當日檔 commit 回 repo，預設的唯讀 token 推不上去
# actions: read 給 check job 查今天跑過沒
permissions:
  contents: write
  actions: read

concurrency:
  group: resolution-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SKIP_IF_DONE: ${{ github.event.inputs.skip_if_done }}
        run: |
          # 手動觸發（沒勾 skip_if_done）一律照跑
          if [ "$EVENT" != "schedule" ] && [ "$SKIP_IF_DONE" != "true" ]; then
            echo "手動觸發，照跑"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 台灣當天 00:00 換成 UTC
          SINCE=$(date -u -d "@$(TZ=Asia/Taipei date -d 'today 00:00' +%s)" +%Y-%m-%dT%H:%M:%SZ)
          DONE=$(gh run list --workflow daily.yml --status success --created ">=$SINCE" \
                   --limit 50 --json databaseId \
                   --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$DONE" -gt 0 ]; then
            echo "台灣當天（$SINCE 之後）已有 $DONE 次成功，跳過"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "台灣當天還沒成功過，開跑"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          # 文字：Mistral 的開源小模型。base_url／model／rpm 由
          # src/config.py 的 LLM_PROVIDERS 決定，這裡只給 provider 和金鑰 ——
          # 在這邊硬寫 BASE_URL/MODEL 會蓋掉那組設定，換 provider 就換不動了。
          RES_LLM_PROVIDER:   "mistral"
          RES_LLM_API_KEY:    ${{ secrets.RES_LLM_API_KEY }}
          # 讀圖：Cloudflare Workers AI（不生圖，只描述看到什麼）
          RES_CF_ACCOUNT_ID:  ${{ secrets.RES_CF_ACCOUNT_ID }}
          RES_CF_API_TOKEN:   ${{ secrets.RES_CF_API_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ -n "${{ github.event.inputs.days }}" ] && ARGS="$ARGS --days ${{ github.event.inputs.days }}"
          set +e
          python3 src/pipeline.py $ARGS
          CODE=$?
          set -e
          echo "pipeline_exit=$CODE" >> "$GITHUB_OUTPUT"
          # 2 = 當日檔有產出但缺拆解：照樣部署（作品流與產業動態仍然有價值），
          #     等部署完再把整個 job 標成失敗。其他非零一律當場中止、不部署。
          if [ "$CODE" != "0" ] && [ "$CODE" != "2" ]; then exit "$CODE"; fi

      # pipeline 失敗就不部署 —— 寧可停在昨天的內容，也不要把空白推上線
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESOLUTION }}
          projectId: resolution-0000
          channelId: live
          # 釘版本：15.34.1 起部署前會先查 serviceusage（要 serviceusage.services.get），
          # 我們的 service account 沒這個權限，2026-10-22 因此 403。15.34.0 不查、可正常部署。
          # 要升級前先替 service account 加「Service Usage Consumer」角色。
          firebaseToolsVersion: "15.34.0"

      # 當日檔存回 repo，這樣有歷史、也能回看前幾天
      - name: Commit day file
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 作品池一起 commit —— Actions 每次都是乾淨的機器，
          # 池子不存回來的話，明天的選題又只剩明天抓到的那些。
          git add web/data/ output/pool.json
          git diff --staged --quiet || git commit -m "資料：$(date -u +%Y-%m-%d) 當日檔與作品池"
          git push

      # 部署完才報失敗：內容已經上線，但缺拆解這件事必須看得見
      - name: Fail if feature missing
        if: steps.pipeline.outputs.pipeline_exit == '2'
        run: |
          REASON="$(cat output/last_failure.txt 2>/dev/null || echo '原因未記錄')"
          echo "::error::當日檔已發布，但今天沒有這一件 —— $REASON"
          {
            echo "### 今天沒有「今日一件」"
            echo ""
            echo "當日檔與作品流已上線，缺的是主菜。"
            echo ""
            echo "原因：\`$REASON\`"
            # 候選逐個的死因。只看 ::error:: 那一行會被最後一個候選誤導 ——
            # 那一行講的是第 N 個候選，不是今天整體的病因。
            if [ -s output/last_failure_detail.md ]; then
              echo ""
              echo "#### 每個候選倒在哪裡"
              echo ""
              cat output/last_failure_detail.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
